<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#170f27">
  <title>Sem conexão | Saj Tem</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080808;color:#f7f3fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.card{width:min(100%,430px);padding:34px 24px;border:1px solid #3d2a58;border-radius:28px;background:linear-gradient(145deg,#241735,#160f23);box-shadow:0 24px 80px #0009;text-align:center}.logo{width:82px;height:82px;border-radius:22px;margin-bottom:22px}.status{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:#ef44441a;color:#fca5a5;font-size:13px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:#ef4444}h1{margin:20px 0 10px;font-size:28px;line-height:1.15}p{margin:0;color:#c4b8cf;line-height:1.55}button,a{display:flex;align-items:center;justify-content:center;width:100%;min-height:50px;margin-top:24px;border:0;border-radius:16px;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}button{background:#ceb6e4;color:#170f27}a{margin-top:10px;border:1px solid #4b3665;color:#e7d8f4}.hint{margin-top:22px;font-size:12px;color:#8e809a}@media(display-mode:standalone){body{padding-top:max(24px,env(safe-area-inset-top));padding-bottom:max(24px,env(safe-area-inset-bottom))}}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/icon-192.png" alt="Saj Tem">
    <div class="status"><span class="dot"></span>Sem conexão</div>
    <h1>Esta página ainda não está disponível offline</h1>
    <p>Conecte-se à internet para carregá-la pela primeira vez. As páginas já visitadas ficam mais rápidas e podem abrir sem conexão.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
    <a href="/">Ir para o início</a>
    <div class="hint" id="hint">Verificando sua conexão…</div>
  </main>
  <script>
    const hint=document.getElementById('hint');
    const update=()=>{hint.textContent=navigator.onLine?'Conexão encontrada. Toque em “Tentar novamente”.':'Você continua offline. Verifique o Wi-Fi ou os dados móveis.'};
    addEventListener('online',()=>location.reload());addEventListener('offline',update);update();
  </script>
</body>
</html>
