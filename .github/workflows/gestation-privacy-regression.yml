name: Gestation privacy and diary regression
on:
  push:
    branches: [main]
    paths:
      - 'src/hooks/useGestacaoStorage.ts'
      - 'src/pages/ferramentas/AcompanhamentoGestacional.tsx'
      - 'scripts/gestation-privacy-regression.test.mjs'
      - '.github/workflows/gestation-privacy-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/gestation-privacy-regression.test.mjs
      - run: npm run typecheck
