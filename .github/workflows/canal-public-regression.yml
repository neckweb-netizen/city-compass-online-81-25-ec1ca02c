name: Public information channel regression
on:
  push:
    branches: [main]
    paths:
      - 'src/pages/CanalInformativo.tsx'
      - 'src/components/canal/CanalInformativoList.tsx'
      - 'src/components/ui/video-player-with-ad.tsx'
      - 'src/hooks/useCanalInformativo.tsx'
      - 'src/lib/canalMedia.ts'
      - 'scripts/canal-public-regression.test.mjs'
      - '.github/workflows/canal-public-regression.yml'
  pull_request:
    paths:
      - 'src/pages/CanalInformativo.tsx'
      - 'src/components/canal/CanalInformativoList.tsx'
      - 'src/components/ui/video-player-with-ad.tsx'
      - 'src/hooks/useCanalInformativo.tsx'
      - 'src/lib/canalMedia.ts'
      - 'scripts/canal-public-regression.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canal-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/canal-public-regression.test.mjs
      - run: npm run typecheck
