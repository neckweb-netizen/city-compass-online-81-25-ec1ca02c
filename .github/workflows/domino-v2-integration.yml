name: Domino V2 isolated PostgreSQL integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/*domino_v2*'
      - 'tests/domino-v2/**'
      - '.github/workflows/domino-v2-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testing-only
          POSTGRES_DB: domino_v2_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d domino_v2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: domino_v2_ci
      PGUSER: postgres
      PGPASSWORD: testing-only
      PGOPTIONS: '-c statement_timeout=20000'
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create disposable Supabase-compatible fixture
        run: psql -X -v ON_ERROR_STOP=1 -f tests/domino-v2/fixture.sql
      - name: Apply Domino V2 prototype migrations in order
        run: |
          set -euo pipefail
          for migration in \
            supabase/migrations/20261118141500_domino_v2_private_server_hands_prototype.sql \
            supabase/migrations/20261118143000_domino_v2_authoritative_moves_prototype.sql \
            supabase/migrations/20261118151000_domino_v2_verified_pass_and_results_prototype.sql \
            supabase/migrations/20261118153000_domino_v2_cleanup_on_room_reset_prototype.sql \
            supabase/migrations/20261118154500_domino_v2_legacy_trigger_private_access_fix.sql \
            supabase/migrations/20261118160500_domino_v2_explicit_staging_room_allowlist.sql
          do
            echo "Applying $migration to disposable PostgreSQL"
            psql -X -v ON_ERROR_STOP=1 --single-transaction -f "$migration"
          done
      - name: Test unauthenticated calls, authorized hands and move atomicity
        run: psql -X -v ON_ERROR_STOP=1 -f tests/domino-v2/integration.sql

      - name: Test ownership, winner scoring and private-hand cleanup
        run: psql -X -v ON_ERROR_STOP=1 -f tests/domino-v2/win-and-reset.sql

      - name: Test JWT-authenticated HTTP RPC through disposable PostgREST
        env:
          PGRST_JWT_SECRET: "domino-v2-test-only-shared-secret-2026-no-real-tokens"
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.domino_salas
            (id,numero_sala,status,jogador_1_id,jogador_2_id,vez_usuario_id)
          VALUES ('ffffffff-ffff-4fff-8fff-ffffffffffff',6,'jogando',
            '11111111-1111-4111-8111-111111111111',
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111');
          INSERT INTO private.domino_v2_salas_habilitadas(sala_id)
          VALUES ('ffffffff-ffff-4fff-8fff-ffffffffffff');
          SQL
          docker run -d --name domino-v2-postgrest --network host \
            -e PGRST_DB_URI="postgres://postgres:testing-only@127.0.0.1:5432/domino_v2_ci" \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET="$PGRST_JWT_SECRET" \
            -e PGRST_SERVER_PORT=3001 \
            postgrest/postgrest:v12.2.8
          trap 'docker logs domino-v2-postgrest || true; docker rm -f domino-v2-postgrest >/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3001/ -o /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Disposable PostgREST was not ready" >&2
            exit 1
          fi
          node tests/domino-v2/http-api.mjs

      - name: Test concurrent dealing and same-tile replay in separate sessions
        run: bash tests/domino-v2/concurrency.sh
