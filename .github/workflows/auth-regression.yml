name: Authentication regression
on:
  push:
    branches: [main]
    paths:
      - 'src/components/auth/**'
      - 'src/hooks/useAuth.tsx'
      - 'src/App.tsx'
      - 'scripts/auth-recovery-module.test.mjs'
      - '.github/workflows/auth-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node --test scripts/auth-recovery-module.test.mjs
