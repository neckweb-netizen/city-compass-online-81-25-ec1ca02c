name: Security checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/security/upload-r2-signatures.test.mjs
      - run: node --test tests/security/security-event-sanitization.test.mjs
      - run: node --test scripts/home-sections.test.mjs
      - run: node --test tests/security/push-notification-dedup.test.mjs
      - run: node --test tests/security/push-notification-links.test.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev
