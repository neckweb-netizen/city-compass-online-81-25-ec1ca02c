name: Vehicle data and CV export regression
on:
  push:
    branches: [main]
    paths:
      - 'src/hooks/useMeuVeiculoStorage.ts'
      - 'supabase/migrations/*vehicle_legacy*'
      - 'src/pages/ferramentas/MeuVeiculo.tsx'
      - 'src/pages/ferramentas/CriadorCurriculo.tsx'
      - 'src/lib/parseBrazilianNumber.ts'
      - 'scripts/vehicle-cv-regression.test.mjs'
      - '.github/workflows/vehicle-cv-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/vehicle-cv-regression.test.mjs
      - run: npm run typecheck
