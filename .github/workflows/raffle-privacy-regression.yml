name: Raffle privacy and reservations regression
on:
  push:
    branches: [main]
    paths:
      - 'src/pages/ferramentas/GeradorRifa.tsx'
      - 'supabase/migrations/*raffle*'
      - 'scripts/raffle-privacy-regression.test.mjs'
      - '.github/workflows/raffle-privacy-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/raffle-privacy-regression.test.mjs
      - run: npm run typecheck
