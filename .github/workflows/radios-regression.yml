name: Radio module regression
on:
  push:
    branches: [main]
    paths:
      - 'src/pages/Radios.tsx'
      - 'src/components/ui/radio-player.tsx'
      - 'src/lib/radioStream.ts'
      - 'scripts/radios-regression.test.mjs'
      - '.github/workflows/radios-regression.yml'
  pull_request:
    paths:
      - 'src/pages/Radios.tsx'
      - 'src/components/ui/radio-player.tsx'
      - 'src/lib/radioStream.ts'
      - 'scripts/radios-regression.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radios:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test scripts/radios-regression.test.mjs
      - run: npm run typecheck
